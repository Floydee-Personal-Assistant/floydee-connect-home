<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Floydee Connect</title>
    <script>
      // GitHub Pages serves unknown paths as this file. Return to the SPA entry
      // point so future client-side routes can recover without a server.
      const target = new URL("/floydee-connect-home/", window.location.origin);
      target.searchParams.set("_path", window.location.pathname + window.location.search + window.location.hash);
      window.location.replace(target);
    </script>
  </head>
  <body></body>
</html>
